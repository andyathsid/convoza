services:
  meilisearch:
    image: getmeili/meilisearch:v1.13
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    environment:
      - MEILI_MASTER_KEY=masterKey
      - MEILI_ENV=${MEILI_ENV:-development}
      # Local benchmark runs should favor ingestion throughput over concurrent
      # search responsiveness, so let indexing use all host threads by default.
      - MEILI_MAX_INDEXING_THREADS=${MEILI_MAX_INDEXING_THREADS:-2}
      # Keep the default aggressive enough to help large imports, but below the
      # full host total so the machine still has breathing room.
      - MEILI_MAX_INDEXING_MEMORY=${MEILI_MAX_INDEXING_MEMORY:-1400MiB}
    ulimits:
      nofile:
        soft: 3000
        hard: 3000

volumes:
  meili-data:
