services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    env_file:
      - ./frontend/.env.local
    depends_on:
      backend:
        condition: service_started
    networks:
      - chatapp

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: air
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./backend/.env:/app/.env
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    env_file:
      - ./backend/.env
    environment:
      MEILI_URL: http://meilisearch:7700
    depends_on:
      meilisearch:
        condition: service_healthy
    networks:
      - chatapp

  meilisearch:
    image: getmeili/meilisearch:v1.13
    env_file:
      - ./backend/.env
    command: ["/bin/sh", "-c", "exec /bin/meilisearch --master-key \"$$MEILI_API_KEY\""]
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    environment:
      MEILI_ENV: development
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - chatapp

networks:
  chatapp:
    driver: bridge

volumes:
  meili-data:
  frontend_node_modules:
  frontend_next:
