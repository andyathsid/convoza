services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    env_file:
      - ./frontend/.env.local
    depends_on:
      backend:
        condition: service_started
    networks:
      - chatapp

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: air
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./backend/.env:/app/.env
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    env_file:
      - ./backend/.env
    networks:
      - chatapp

  typesense:
    image: typesense/typesense:28.0
    command: --data-dir /data --api-key=${TYPESENSE_API_KEY:-xyz} --enable-cors
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    networks:
      - chatapp

  typesense-dashboard:
    image: ghcr.io/bfritscher/typesense-dashboard:latest
    ports:
      - "8080:80"
    depends_on:
      typesense:
        condition: service_started
    networks:
      - chatapp

networks:
  chatapp:
    driver: bridge

volumes:
  typesense_data:
  frontend_node_modules:
  frontend_next: