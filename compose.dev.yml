services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    command: npm run dev
    ports:
      - "3001:3001"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    env_file:
      - ./frontend/.env.local
    depends_on:
      backend:
        condition: service_started
    networks:
      - chatapp

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: air
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - ./backend/.env:/app/.env
      - ./backend/firebase-service-account.json:/app/firebase-service-account.json:ro
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chatapp

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chatapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - chatapp

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - chatapp

  typesense:
    image: typesense/typesense:28.0
    command: --data-dir /data --api-key=${TYPESENSE_API_KEY:-xyz} --enable-cors
    ports:
      - "8108:8108"
    volumes:
      - typesense_data:/data
    networks:
      - chatapp

  typesense-dashboard:
    image: ghcr.io/bfritscher/typesense-dashboard:latest
    ports:
      - "8080:80"
    depends_on:
      typesense:
        condition: service_started
    networks:
      - chatapp

networks:
  chatapp:
    driver: bridge

volumes:
  pgdata:
  typesense_data:
  frontend_node_modules:
  frontend_next:
