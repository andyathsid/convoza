root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -buildvcs=false -o ./tmp/main ./cmd/app"
  entrypoint = ["./tmp/main"]
  include_ext = ["go", "tpl", "tmpl", "html"]
  exclude_dir = ["build", "tmp", "vendor", "testdata"]
  exclude_regex = ["_test.go"]
  delay = 1000
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
