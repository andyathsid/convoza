services:                                                                                                                               
  meilisearch:
    image: getmeili/meilisearch:latest                                                                                                  
    container_name: meili_bench                                                                                                         
    env_file:
      - ./backend/.env
    command: ["/bin/sh", "-c", "exec /bin/meilisearch --master-key \"$$MEILI_API_KEY\""]
    environment:
      - MEILI_ENV=${MEILI_ENV:-development}
      # Benchmark imports can monopolize the node, so do not keep the default
      # "half the available threads" cap that Meilisearch uses to protect live search latency.
      - MEILI_MAX_INDEXING_THREADS=${MEILI_MAX_INDEXING_THREADS:-2}
      # Give indexing a slightly larger working set on the 2 GiB benchmark VM,
      # while still leaving headroom for Docker, the OS, and the benchmark client.
      - MEILI_MAX_INDEXING_MEMORY=${MEILI_MAX_INDEXING_MEMORY:-1400MiB}
    ulimits:
      nofile:
        soft: 3000
        hard: 3000
    ports:                                                                                                                              
      - "7700:7700"                                                                                                                     
    volumes:                                                                                                                            
      - ./meili_data:/meili_data                                                                                                        
    restart: unless-stopped                                                                                                             
